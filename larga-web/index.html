<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=short-logo" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f57c1f" />
    <!-- iOS has no manifest support for these, so they stay as meta tags. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/larga-short-apple-touch.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Larga" />
    <meta name="description" content="Track jeepneys in real time across Nueva Vizcaya." />
    <!-- Baloo 2 — the same display font the mobile app loads via
         @expo-google-fonts/baloo-2. Variable font, so one file covers the
         400/500/600/700/800 weights the design uses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- The landing page hero artwork is the LCP element, and it is referenced
         from inside a React component, so the browser would otherwise only
         discover it once the bundle has parsed. imagesrcset/imagesizes must
         mirror the <img> in SplashPage.jsx, or the preload fetches a second,
         different file instead of priming the one the page uses. -->
    <link
      rel="preload"
      as="image"
      href="/hero/right-visual-larga-new.png"
      fetchpriority="high"
    />
    <title>Larga — Real-Time Jeepney Tracking</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
